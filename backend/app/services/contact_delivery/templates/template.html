<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your SiteFormo demonstration enquiry</title>
  <style>
    @media only screen and (max-width: 640px) {
      .sf-shell { width: 100% !important; }
      .sf-pad { padding-left: 20px !important; padding-right: 20px !important; }
      .sf-message { padding: 18px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#f3f5f7;color:#17212b;font-family:Arial,Helvetica,sans-serif;">
  <div role="article" aria-roledescription="email" aria-label="Your SiteFormo demonstration enquiry" lang="en">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f3f5f7;">
      <tr><td align="center" style="padding:28px 12px;">
        <table role="presentation" class="sf-shell" width="620" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:620px;background:#ffffff;border-radius:14px;overflow:hidden;">
          <tr><td class="sf-pad" style="padding:30px 36px 24px;background:#142b3a;color:#ffffff;">
            <div style="font-size:22px;font-weight:700;letter-spacing:.2px;">SiteFormo</div>
            <div style="margin-top:7px;font-size:14px;color:#c9d8e1;">Email communication example</div>
          </td></tr>
          <tr><td class="sf-pad" style="padding:32px 36px 10px;">
            <p style="margin:0 0 22px;font-size:17px;line-height:1.55;">Hi {{first_name}},</p>
            <p style="margin:0 0 10px;font-size:15px;font-weight:700;line-height:1.5;color:#142b3a;">Your message:</p>
            <div class="sf-message" style="padding:22px;background:#f7fafb;border:1px solid #dce5e9;border-radius:10px;font-size:16px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;">&quot;{{message}}&quot;</div>
          </td></tr>
          <tr><td class="sf-pad" style="padding:22px 36px 0;">
            <p style="margin:0;font-size:15px;line-height:1.6;">This is an example of how your customers can begin an email conversation from your future website.</p>
          </td></tr>
          <tr><td class="sf-pad" style="padding:22px 36px 34px;">
            <p style="margin:0;font-size:15px;line-height:1.6;">SiteFormo</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </div>
</body>
</html>
