<!-- SiteFormo Q2 V2 — local WPCode candidate; do not publish directly. -->
<script>
(function(){
  "use strict";
  const Q2_PATH="/extended-questionnaire";
  if(location.pathname.replace(/\/+$/,"")!==Q2_PATH)return;

  const API_BASE="https://siteformo-ai-platform-production.up.railway.app";
  const DRAFT_KEY="siteformo_q2_v2_draft";
  const ORDER_KEY="siteformo_order_id";
  const JOURNEY_KEY="siteformo_journey_credential_v1";
  const STEPS=["q2_intro","q2_business_identity","q2_business_activity","q2_location","q2_audience_goal","q2_functions","q2_assets","q2_delivery","q2_review","q2_package_confirmation"];
  const FUNCTION_CARDS=[
    ["standard_content_contact","Standard content/contact site","Included from Starter","known"],
    ["contact_enquiry","Contact / enquiry form","Included from Starter","known"],
    ["direct_contact_channel","Direct WhatsApp or chat contact","Included from Starter","known"],
    ["blog_news","Blog / news","Package rule needs review","review"],
    ["newsletter","Newsletter","Package rule needs review","review"],
    ["booking","Booking","Scope and package need review","review"],
    ["catalogue_display","Catalogue / product display","Scope and package need review","review"],
    ["transactional_ecommerce","Online sales / checkout","Scope and package need review","review"],
    ["customer_account_login","Customer account / login","Scope and package need review","review"],
    ["portal_membership","Portal / membership","Scope and package need review","review"],
    ["multilingual","Multilingual website","Scope and package need review","review"],
    ["advanced_form","Advanced form","Scope and package need review","review"],
    ["search_filter_compare","Search / filter / compare","Scope and package need review","review"],
    ["custom_other","Other custom functionality","Scope and package need review","review"]
  ];
  function q1Context(){try{return JSON.parse(localStorage.getItem("siteformo_q1_v2_draft")||"null")||{};}catch(_e){return {};}}
  const q1=q1Context(),acceptedPackages=["starter","business","reference","advanced"];
  const browsed=q1.package_browsing_context&&acceptedPackages.includes(q1.package_browsing_context.package_key)?q1.package_browsing_context.package_key:null;
  const analyzed=q1.existing_website&&q1.existing_website.analysis&&q1.existing_website.analysis.source==="existing_website"&&q1.existing_website.analysis.status==="unconfirmed"?q1.existing_website.analysis.data||{}:null;
  const safeHints=analyzed?{source:"existing_website",status:"unconfirmed",business_hints:Array.isArray(analyzed.business_hints)?analyzed.business_hints:[],function_hints:Array.isArray(analyzed.function_hints)?analyzed.function_hints:[],complexity_hints:Array.isArray(analyzed.complexity_hints)?analyzed.complexity_hints:[]}:{};
  const fresh=()=>({step:"q2_intro",business_identity:{status:"",name:""},business_activity:{niche:"",broad_model:"",other_clarification:""},operating_model:"",location:{public_address:"",service_area:"",multiple_locations_summary:""},audience:"",primary_goal:"",functions:[],trust_materials:[],media:{photos:"",client_photos_timing:null,video:""},social_presence:{expected_channels:[],other_platform:"",links:"pending",presentation:"flexible"},logo:{choice:"",price_eur:0,scope:{}},delivery_context:{hosting_status:"",hosting_help_included:true,domain_and_hosting_client_owned:true,installation_selected:false,installation_price_eur:0},paid_structural_options:[],package_context:{starting_package:browsed,source:browsed?"package_browsing_context":"direct_entry",rule_version:"ireland_accepted_v1"},analysis_hints:safeHints,assistant_context:{current_step_id:"q2_intro",enabled:false},legal_gate_confirmed:false,package_and_addons_confirmed:false,qualification:null});
  let state=fresh();
  try{const cached=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");if(cached&&cached.schema_version===2)state=Object.assign(state,cached);}catch(_e){}

  const css=document.createElement("style");css.textContent=`
    html,body{max-width:100%;overflow-x:clip}.sfq2{--ink:#17231d;--muted:#607069;--line:#dbe5df;--brand:#1d6b4c;box-sizing:border-box;max-width:900px;margin:32px auto 110px;padding:0 18px;color:var(--ink);font:16px/1.5 system-ui,sans-serif}.sfq2 *{box-sizing:border-box}.sfq2-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(20px,4vw,42px);box-shadow:0 16px 48px #193c2920}.sfq2-progress{font-size:13px;color:var(--muted);margin-bottom:12px}.sfq2 h1{font-size:clamp(28px,5vw,46px);line-height:1.1;margin:0 0 12px}.sfq2 h2{font-size:clamp(23px,4vw,34px);margin:0 0 10px}.sfq2 p{color:var(--muted)}.sfq2-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:22px 0}.sfq2-choice{min-height:54px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}.sfq2-choice[aria-pressed=true]{border-color:var(--brand);box-shadow:0 0 0 2px #1d6b4c22;background:#f3faf6}.sfq2-choice small{display:block;color:var(--muted);margin-top:3px}.sfq2-field{display:block;margin:18px 0}.sfq2-field span{display:block;font-weight:650;margin-bottom:6px}.sfq2 input{width:100%;min-height:50px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit}.sfq2 input:focus,.sfq2 button:focus-visible{outline:3px solid #75b99a;outline-offset:2px}.sfq2-actions{display:flex;justify-content:space-between;gap:12px;margin-top:26px}.sfq2-btn{min-height:50px;border:0;border-radius:14px;padding:12px 20px;font:700 16px/1 system-ui;cursor:pointer}.sfq2-btn-primary{background:var(--brand);color:#fff;margin-left:auto}.sfq2-btn-secondary{background:#eef3f0;color:var(--ink)}.sfq2-error{color:#a12626;font-weight:650;margin:12px 0}.sfq2-note{padding:12px 14px;border-radius:12px;background:#f3f7f5;color:#405149}.sfq2-warning{background:#fff5da;border:1px solid #e5c66c}.sfq2-summary{display:grid;gap:10px}.sfq2-summary div{padding:12px;border-bottom:1px solid var(--line)}.sfq2-package{font-size:20px;font-weight:750}.sfq2-check{display:flex;gap:10px;align-items:flex-start;margin:15px 0}.sfq2-check input{width:22px;min-height:22px}.sfq2-modal{position:fixed;inset:0;background:#14231bbb;display:grid;place-items:center;padding:20px;z-index:99999}.sfq2-modal>div{max-width:480px;background:white;border-radius:18px;padding:24px}.sfq2[aria-busy=true]{opacity:.72;pointer-events:none}@media(max-width:600px){.sfq2{margin-top:14px;padding:0 12px}.sfq2-grid{grid-template-columns:1fr}.sfq2-card{padding:20px 16px}.sfq2-actions{position:relative;flex-wrap:wrap}.sfq2-btn{min-width:110px}}
  `;document.head.appendChild(css);
  const root=document.createElement("main");root.id="siteformo-q2-v2";root.className="sfq2";root.dataset.q2Step=state.step;document.body.appendChild(root);
  const esc=v=>String(v??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const saveDraft=()=>{state.schema_version=2;state.assistant_context={current_step_id:state.step,enabled:false};localStorage.setItem(DRAFT_KEY,JSON.stringify(state));root.dataset.q2Step=state.step;};
  const choose=(key,value)=>{state[key]=value;saveDraft();render();};
  const choice=(key,value,label,selected=state[key]===value)=>`<button type="button" class="sfq2-choice" data-key="${key}" data-value="${value}" aria-pressed="${selected}">${label}</button>`;
  const grid=items=>`<div class="sfq2-grid">${items.join("")}</div>`;
  const nav=(back=true,next="Continue")=>`<div class="sfq2-actions">${back?'<button type="button" class="sfq2-btn sfq2-btn-secondary" data-back>Back</button>':''}<button type="button" class="sfq2-btn sfq2-btn-primary" data-next>${next}</button></div>`;
  const progress=()=>state.step==="q2_intro"?"":`<div class="sfq2-progress">Detailed questionnaire · ${Math.max(1,STEPS.indexOf(state.step))} of ${STEPS.length-1}</div>`;
  const title=(h,body="")=>`${progress()}<h1>${h}</h1>${body?`<p>${body}</p>`:""}`;
  const field=(id,label,value,type="text",placeholder="")=>`<label class="sfq2-field"><span>${label}</span><input id="${id}" data-field="${id}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}"></label>`;

  function screen(){
    if(state.step==="q2_intro")return title("A few simple questions","Tell us the facts. SiteFormo will plan the pages and structure—no sitemap or long brief needed.")+nav(false,"Start");
    if(state.step==="q2_business_identity")return title("What name should we use?")+grid([
      choice("business_identity.status","business_name","Business name",state.business_identity.status==="business_name"),choice("business_identity.status","personal_name","My personal name",state.business_identity.status==="personal_name"),choice("business_identity.status","temporary_pending","Name not decided yet",state.business_identity.status==="temporary_pending")
    ])+(state.business_identity.status&&state.business_identity.status!=="temporary_pending"?field("identity_name",state.business_identity.status==="business_name"?"Business name":"Your name",state.business_identity.name):state.business_identity.status==="temporary_pending"?'<p class="sfq2-note">We will keep the identity temporary. We will not invent a final name.</p>':"")+nav();
    if(state.step==="q2_business_activity")return title("What does the business do?","Use a short factual answer, such as Electrician or Dental clinic.")+field("niche","Business or niche",state.business_activity.niche,"text","Electrician")+grid(["local_service|Local service","consultant_expert|Consultant / expert","clinic_beauty_wellness|Clinic / beauty / wellness","construction_renovation|Construction / renovation","restaurant_cafe|Restaurant / café","portfolio_creative|Portfolio / creative","other|Other"].map(x=>{const [v,l]=x.split("|");return choice("business_activity.broad_model",v,l,state.business_activity.broad_model===v)}))+(state.business_activity.broad_model==="other"?field("other_clarification","Short clarification",state.business_activity.other_clarification):"")+nav();
    if(state.step==="q2_location")return title("How do you work with customers?")+grid(["customer_location|Customers visit my location","travel_to_customers|I travel to customers","both|Both","online_remote|Online / remote","multiple_locations|Multiple locations"].map(x=>{const [v,l]=x.split("|");return choice("operating_model",v,l)}))+(state.operating_model==="customer_location"||state.operating_model==="both"?field("public_address","Public business address",state.location.public_address):"")+(state.operating_model==="travel_to_customers"||state.operating_model==="both"?field("service_area","Service area / region",state.location.service_area):"")+(state.operating_model==="multiple_locations"?field("multiple_locations_summary","High-level location information",state.location.multiple_locations_summary):"")+nav();
    if(state.step==="q2_audience_goal")return title("Who is the website for?")+grid(["individuals|Individuals / private customers","businesses|Businesses","both|Both","organisations_public_sector|Organisations / public sector","mixed_unsure|Mixed / not sure"].map(x=>{const [v,l]=x.split("|");return choice("audience",v,l)}))+`<h2>What is the primary goal?</h2>`+grid(["enquiries|Enquiries","calls|Calls","quote_requests|Quote requests","bookings|Bookings","online_sales|Online sales","physical_visits|Visits to a location","present_and_build_trust|Present the business / build trust"].map(x=>{const [v,l]=x.split("|");return choice("primary_goal",v,l)}))+nav();
    if(state.step==="q2_functions")return title("What must the website do?","Package consequences are shown before a function is added.")+`<div class="sfq2-grid">${FUNCTION_CARDS.map(([k,l,e,r])=>`<button type="button" class="sfq2-choice" data-function="${k}" data-review="${r}" aria-pressed="${state.functions.some(f=>f.key===k)}">${l}<small>${e}</small></button>`).join("")}</div>`+(state.functions.some(f=>f.key==="blog_news")?'<p class="sfq2-note">After launch, SiteFormo may offer one-off placement of client-supplied finished articles. Pricing is pending owner approval; this is not part of checkout.</p>':"")+(state.functions.some(f=>["catalogue_display","transactional_ecommerce"].includes(f.key))?'<p class="sfq2-note">Future product additions may be available as a one-off service using client-supplied content. Pricing is provisional and is not added here.</p>':"")+nav();
    if(state.step==="q2_assets")return title("What materials are available?")+`<h2>Trust materials</h2>`+grid(["reviews|Reviews","project_photos|Project photos","certifications|Certifications","awards|Awards","client_logos|Client / company logos","team_photos|Team photos","none_yet|None yet"].map(x=>{const [v,l]=x.split("|");return `<button type="button" class="sfq2-choice" data-trust="${v}" aria-pressed="${state.trust_materials.includes(v)}">${l}</button>`})) +`<h2>Photos</h2>`+grid(["client_provides|I will provide my own photos","siteformo_selects|SiteFormo may select suitable photos","none|I do not want photos"].map(x=>{const [v,l]=x.split("|");return choice("media.photos",v,l,state.media.photos===v)}))+(state.media.photos==="client_provides"?grid([choice("media.client_photos_timing","available","Available now",state.media.client_photos_timing==="available"),choice("media.client_photos_timing","later","I will provide them later",state.media.client_photos_timing==="later")]):"")+`<h2>Video</h2>`+grid(["none|No video","client_has|I have a video","client_later|I will provide a video later"].map(x=>{const [v,l]=x.split("|");return choice("media.video",v,l,state.media.video===v)}))+`<h2>Social presence</h2>`+grid(["instagram|Instagram","facebook|Facebook","tiktok|TikTok","linkedin|LinkedIn","youtube|YouTube","telegram|Telegram","other|Other","none|None"].map(x=>{const [v,l]=x.split("|");return `<button type="button" class="sfq2-choice" data-social="${v}" aria-pressed="${state.social_presence.expected_channels.includes(v)}">${l}</button>`}))+(state.social_presence.expected_channels.includes("other")?field("other_platform","Platform name",state.social_presence.other_platform):"")+nav();
    if(state.step==="q2_delivery")return title("Logo and delivery")+`<h2>Logo</h2>`+grid([choice("logo.choice","client_has","I have a logo / will provide it",state.logo.choice==="client_has"),choice("logo.choice","siteformo_simple_logo","Simple SiteFormo Logo · +€100",state.logo.choice==="siteformo_simple_logo"),choice("logo.choice","none","No logo required",state.logo.choice==="none")])+(state.logo.choice==="siteformo_simple_logo"?'<p class="sfq2-note">One direction, one revision and web-ready delivery. No naming, full branding or trademark/legal clearance.</p>':"")+`<h2>Hosting</h2>`+grid([choice("delivery_context.hosting_status","already_have","I already have hosting",state.delivery_context.hosting_status==="already_have"),choice("delivery_context.hosting_status","do_not_have","I do not have hosting",state.delivery_context.hosting_status==="do_not_have"),choice("delivery_context.hosting_status","not_sure","Not sure",state.delivery_context.hosting_status==="not_sure")])+`<p class="sfq2-note">Help choosing hosting is included. Your domain and hosting remain yours.</p><label class="sfq2-check"><input type="checkbox" data-install ${state.delivery_context.installation_selected?"checked":""}> Installation by SiteFormo · +€125</label><h2>Paid structural option</h2><label class="sfq2-check"><input type="checkbox" data-video-entry ${state.paid_structural_options.some(x=>x.key==="video_entry_page")?"checked":""}> Video Entry Page · +€120 (Starter/Business; counts as the single additional page)</label>`+nav();
    if(state.step==="q2_review")return title("Review your answers","SiteFormo—not you—will plan the sitemap and page order.")+`<div class="sfq2-summary"><div><b>Identity</b><br>${esc(state.business_identity.name||"Name pending")}</div><div><b>Business</b><br>${esc(state.business_activity.niche)}</div><div><b>Goal</b><br>${esc(state.primary_goal)}</div><div><b>Functions</b><br>${esc(state.functions.map(x=>x.key).join(", ")||"Standard content only")}</div></div>`+nav(true,"Calculate scope");
    const q=state.qualification||{},proposed=q.proposed_paid_pages||[],fit=q.recommended_package||(proposed.length?"Commercial path confirmation required":"Manual review required");return title("Confirm the scope")+`<p>Starting context: <b>${esc(state.package_context.starting_package||"None")}</b></p><p class="sfq2-package">Calculated fit: ${esc(fit)}</p>${q.optional_recommendation_reasons?.some(x=>x.reason_code.includes("downgrade"))?'<p class="sfq2-note">Your confirmed requirements fit a cheaper package than the one you browsed.</p>':""}${proposed.length?'<p class="sfq2-note sfq2-warning">The planner found more than one commercial path. No paid page or higher package has been selected automatically.</p>':""}${q.unresolved_requirements?.length?`<div class="sfq2-note sfq2-warning">${q.unresolved_requirements.length} requirement(s) need confirmation or manual review. Checkout remains unavailable.</div>`:""}<label class="sfq2-check"><input type="checkbox" data-confirm-package ${state.package_and_addons_confirmed?"checked":""}> I confirm the calculated package and selected add-ons</label><label class="sfq2-check"><input type="checkbox" data-legal ${state.legal_gate_confirmed?"checked":""}> I confirm the project details are accurate and accept the next-step terms</label><div aria-live="polite" id="sfq2-save-status"></div>`+nav(true,q.checkout_ready?"Save and continue to checkout":"Save scope");
  }

  function render(error=""){
    root.dataset.q2Step=state.step;root.innerHTML=`<section class="sfq2-card">${error?`<div class="sfq2-error" role="alert" id="sfq2-error">${esc(error)}</div>`:""}${screen()}</section>`;bind();
  }
  function setPath(path,value){const parts=path.split(".");let target=state;while(parts.length>1)target=target[parts.shift()];target[parts[0]]=value;saveDraft();render();}
  function bind(){
    root.querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>setPath(b.dataset.key,b.dataset.value));
    root.querySelectorAll("[data-field]").forEach(i=>i.onchange=()=>{const map={identity_name:[state.business_identity,"name"],niche:[state.business_activity,"niche"],other_clarification:[state.business_activity,"other_clarification"],public_address:[state.location,"public_address"],service_area:[state.location,"service_area"],multiple_locations_summary:[state.location,"multiple_locations_summary"],other_platform:[state.social_presence,"other_platform"]};const [o,k]=map[i.dataset.field];o[k]=i.value.trim();saveDraft();});
    root.querySelectorAll("[data-function]").forEach(b=>b.onclick=()=>toggleFunction(b.dataset.function,b.dataset.review));
    root.querySelectorAll("[data-trust]").forEach(b=>b.onclick=()=>toggleMulti(state.trust_materials,b.dataset.trust,"none_yet"));
    root.querySelectorAll("[data-social]").forEach(b=>b.onclick=()=>toggleMulti(state.social_presence.expected_channels,b.dataset.social,"none"));
    const install=root.querySelector("[data-install]");if(install)install.onchange=()=>{state.delivery_context.installation_selected=install.checked;state.delivery_context.installation_price_eur=install.checked?125:0;saveDraft();};
    const entry=root.querySelector("[data-video-entry]");if(entry)entry.onchange=()=>{state.paid_structural_options=entry.checked?[{key:"video_entry_page",quantity:1,price_eur_each:120,counts_as_page:true,explicit_confirmed:true}]:[];saveDraft();};
    const pc=root.querySelector("[data-confirm-package]");if(pc)pc.onchange=()=>{state.package_and_addons_confirmed=pc.checked;saveDraft();};
    const legal=root.querySelector("[data-legal]");if(legal)legal.onchange=()=>{state.legal_gate_confirmed=legal.checked;saveDraft();};
    const back=root.querySelector("[data-back]");if(back)back.onclick=()=>{state.step=STEPS[Math.max(0,STEPS.indexOf(state.step)-1)];saveDraft();render();};
    const next=root.querySelector("[data-next]");if(next)next.onclick=advance;
  }
  function toggleMulti(list,key,none){if(key===none){list.splice(0,list.length,key);}else{const n=list.indexOf(none);if(n>=0)list.splice(n,1);const i=list.indexOf(key);i>=0?list.splice(i,1):list.push(key);}saveDraft();render();}
  function toggleFunction(key,review){const i=state.functions.findIndex(x=>x.key===key);if(i>=0){state.functions.splice(i,1);saveDraft();render();return;}if(review==="review"){confirmFunction(key);return;}state.functions.push({key,confirmed:true});saveDraft();render();}
  function confirmFunction(key){const modal=document.createElement("div");modal.className="sfq2-modal";modal.innerHTML=`<div role="dialog" aria-modal="true"><h2>Scope review required</h2><p>This function is recorded, but the accepted package contract does not yet define a safe automatic package floor. Adding it will pause checkout for manual review.</p><div class="sfq2-actions"><button class="sfq2-btn sfq2-btn-secondary" data-keep>Keep current scope</button><button class="sfq2-btn sfq2-btn-primary" data-add>Add function</button></div></div>`;document.body.appendChild(modal);modal.querySelector("[data-keep]").onclick=()=>modal.remove();modal.querySelector("[data-add]").onclick=()=>{state.functions.push({key,confirmed:true});saveDraft();modal.remove();render();};modal.querySelector("[data-keep]").focus();}
  function validate(){
    const missing=[];
    if(state.step==="q2_business_identity"&&(!state.business_identity.status||(state.business_identity.status!=="temporary_pending"&&!state.business_identity.name)))missing.push(["Choose a name status and enter the factual name.","identity_name"]);
    if(state.step==="q2_business_activity"&&(!state.business_activity.niche||!state.business_activity.broad_model||(state.business_activity.broad_model==="other"&&!state.business_activity.other_clarification)))missing.push(["Complete the business activity details.","niche"]);
    if(state.step==="q2_location"&&(!state.operating_model||(state.operating_model==="customer_location"&&!state.location.public_address)||(state.operating_model==="travel_to_customers"&&!state.location.service_area)||(state.operating_model==="both"&&(!state.location.public_address||!state.location.service_area))||(state.operating_model==="multiple_locations"&&!state.location.multiple_locations_summary)))missing.push(["Complete the location information for the selected operating model.","public_address"]);
    if(state.step==="q2_audience_goal"&&(!state.audience||!state.primary_goal))missing.push(["Choose both the audience and primary goal.",null]);
    if(state.step==="q2_assets"&&(!state.media.photos||!state.media.video||(state.media.photos==="client_provides"&&!state.media.client_photos_timing)||!state.trust_materials.length||!state.social_presence.expected_channels.length||(state.social_presence.expected_channels.includes("other")&&!state.social_presence.other_platform)))missing.push(["Complete the trust, photo, video and social choices.",null]);
    if(state.step==="q2_delivery"&&(!state.logo.choice||!state.delivery_context.hosting_status))missing.push(["Choose both logo and hosting options.",null]);
    return missing[0]||null;
  }
  async function advance(){
    const issue=validate();if(issue){render(issue[0]);const el=issue[1]&&root.querySelector(`[data-field="${issue[1]}"]`);const target=el||root.querySelector("button,input");if(target){target.setAttribute("aria-invalid","true");target.setAttribute("aria-describedby","sfq2-error");target.scrollIntoView({block:"center",behavior:"smooth"});target.focus();}return;}
    if(state.step==="q2_package_confirmation"){await saveCanonical();return;}
    if(state.step==="q2_review"){await saveCanonical(true);return;}
    state.step=STEPS[STEPS.indexOf(state.step)+1];saveDraft();render();scrollTo({top:0,behavior:"smooth"});
  }
  function canonical(){
    const copy=JSON.parse(JSON.stringify(state));delete copy.step;delete copy.qualification;copy.flow_version="q2_v2";copy.schema_version=2;
    if(copy.logo.choice==="siteformo_simple_logo"){copy.logo.price_eur=100;copy.logo.scope={one_direction:true,one_revision:true,web_ready_delivery:true,full_branding:false,naming:false,trademark_or_legal_clearance:false};}else{copy.logo.price_eur=0;copy.logo.scope={};}
    if(!copy.analysis_hints.source)copy.analysis_hints={business_hints:[],function_hints:[],complexity_hints:[]};
    return copy;
  }
  async function saveCanonical(moveToConfirmation=false){
    const orderId=new URL(location.href).searchParams.get("order_id")||localStorage.getItem(ORDER_KEY);const credential=localStorage.getItem(JOURNEY_KEY);
    if(!orderId||!credential){render("This Journey or project cannot be verified. Return to Q1 and resume the same project.");return;}
    root.setAttribute("aria-busy","true");
    try{const response=await fetch(`${API_BASE}/api/orders/${encodeURIComponent(orderId)}/q2`,{method:"PATCH",headers:{"Content-Type":"application/json","X-SiteFormo-Visitor":credential},body:JSON.stringify(canonical())});if(!response.ok)throw new Error("Canonical Q2 save failed");const result=await response.json();state.qualification=result.scope_qualification;if(moveToConfirmation)state.step="q2_package_confirmation";saveDraft();render();
      if(!moveToConfirmation){const status=root.querySelector("#sfq2-save-status");if(status)status.textContent=result.scope_qualification.checkout_ready?"Scope saved. Checkout creation belongs to the later guarded payment-boundary phase.":"Scope saved. Checkout is unavailable until all requirements are resolved and confirmed.";}
    }catch(_e){render("We could not save this project. Nothing was sent to checkout. Please try again.");}
    finally{root.removeAttribute("aria-busy");}
  }
  window.addEventListener("scroll",()=>{document.dispatchEvent(new CustomEvent("siteformo:assistant-collapse",{detail:{source:"q2_scroll",terminateConversation:false}}));},{passive:true});
  render();
})();
</script>
