<!-- SiteFormo Ireland Q1 V2 owner-review candidate. -->
<meta charset="utf-8">
<div id="sf-q1-root"></div>
<style>
body:has(#sf-q1-root){margin:0}
#sf-q1-root,#sf-q1-root *{box-sizing:border-box}#sf-q1-root{--navy:#102a2a;--green:#19715f;--cream:#f7f5ef;--ink:#17302d;--muted:#5e706d;--line:#cfdcd7;min-height:100svh;background:linear-gradient(145deg,#f7f5ef,#edf5f0);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding:clamp(20px,4vw,52px) 20px;overflow-x:clip}.sfq-shell{width:min(940px,100%);min-height:calc(100svh - clamp(40px,8vw,104px));margin:auto;display:flex;flex-direction:column;justify-content:center}.sfq-context{font-size:.8rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin:0 0 14px}.sfq-progress{display:flex;align-items:center;gap:16px;margin:0 0 26px;color:var(--muted);font-size:.92rem;font-weight:700}.sfq-progress-track{height:4px;background:#dbe5df;border-radius:99px;flex:1;overflow:hidden}.sfq-progress-bar{display:block;height:100%;background:var(--green)}.sfq-panel{background:rgba(255,255,255,.88);border:1px solid rgba(23,48,45,.1);border-radius:30px;padding:clamp(30px,6vw,72px);box-shadow:0 30px 80px rgba(16,42,42,.1)}.sfq-panel h1{max-width:780px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.25rem,6vw,4.6rem);font-weight:500;line-height:1.02;letter-spacing:-.045em;margin:0 0 18px;color:var(--navy)}.sfq-lead{max-width:630px;color:var(--muted);font-size:clamp(1rem,2vw,1.18rem);line-height:1.65;margin:0 0 30px}.sfq-example{display:inline-flex;align-items:center;gap:9px;margin:0 0 22px;color:var(--green);font-weight:750}.sfq-example:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--green)}.sfq-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:30px 0 10px}.sfq-option{position:relative;min-height:68px;width:100%;border:1.5px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);font:inherit;font-weight:750;text-align:left;padding:17px 48px 17px 18px;cursor:pointer;transition:border-color .16s,box-shadow .16s,transform .16s}.sfq-option:hover{border-color:#76a99e;transform:translateY(-1px)}.sfq-option[aria-checked="true"]{border-color:var(--green);box-shadow:0 0 0 3px rgba(25,113,95,.14);background:#f5fbf8}.sfq-option[aria-checked="true"]:after{content:"✓";position:absolute;right:18px;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff}.sfq-field{max-width:610px;margin:24px 0 0}.sfq-field[hidden]{display:none}.sfq-field label{display:block;font-weight:800;margin:0 0 9px}.sfq-hint{display:block;color:var(--muted);font-size:.92rem;line-height:1.5;margin:8px 0 0}.sfq-input{width:100%;min-height:56px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font:inherit;padding:14px 16px}.sfq-input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(25,113,95,.14);outline:none}.sfq-actions{display:flex;align-items:center;gap:12px;margin-top:34px}.sfq-button{min-height:52px;border-radius:999px;border:0;padding:14px 25px;font:inherit;font-weight:800;cursor:pointer}.sfq-primary{background:var(--navy);color:#fff;min-width:156px}.sfq-primary:hover{background:#17443f}.sfq-secondary{background:transparent;color:var(--navy);border:1.5px solid var(--line)}.sfq-error{min-height:24px;margin-top:13px;color:#a82d2d;font-weight:700}.sfq-status{margin-top:8px;color:var(--muted);font-size:.94rem}.sfq-summary{display:grid;gap:12px;max-width:650px;margin:28px 0}.sfq-summary div{padding:14px 16px;border-radius:13px;background:#eef6f2}.sfq-summary dt{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--green)}.sfq-summary dd{margin:4px 0 0;font-weight:750}.sfq-option:focus-visible,.sfq-button:focus-visible,.sfq-input:focus-visible{outline:3px solid #cf8b19;outline-offset:3px}@media(max-width:640px){#sf-q1-root{padding:14px 12px 22px}.sfq-shell{min-height:calc(100svh - 36px)}.sfq-panel{border-radius:22px;padding:27px 20px}.sfq-panel h1{font-size:clamp(2rem,11vw,3rem)}.sfq-options{grid-template-columns:1fr;margin-top:22px}.sfq-option{min-height:60px}.sfq-actions{align-items:stretch;flex-direction:column-reverse}.sfq-button{width:100%}}@media(prefers-reduced-motion:reduce){#sf-q1-root *{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
@media(min-width:641px){#sf-q1-root{padding:32px 20px}.sfq-shell{min-height:calc(100svh - 64px)}.sfq-panel{padding:52px}}
</style>
<script>
(function(){
"use strict";
const root=document.getElementById("sf-q1-root");if(!root)return;
const API_BASE=window.SITEFORMO_API_BASE||"https://siteformo-ai-platform-production.up.railway.app",Q2_URL="/extended-questionnaire/",DRAFT_KEY="siteformo_q1_v2_draft",VISITOR_KEY="siteformo_journey_credential_v1";
const REVIEW_MODE=window.SITEFORMO_Q1_REVIEW_MODE===true||["localhost","127.0.0.1"].includes(location.hostname),STEPS=["intro","q1","q2","q3","complete"];
const INTENTS={one_page:"One-page website",business_site:"Business website",ecommerce_catalog:"Online store or catalogue",online_service_platform:"Online service platform",unsure:"I’m not sure yet"},CHANNELS={whatsapp:"WhatsApp",telegram:"Telegram",email:"Email"};
const fresh=()=>({flow_version:"q1_v2",schema_version:2,current_step:"intro",project_class_intent:null,preferred_contact:{channel:null,value:"",normalized_value:"",purpose:"operational_communication",display_on_generated_website:false},existing_website:{has_existing_website:null,url:null,analysis:null},examples_context:{},package_browsing_context:null,package_qualification:{status:"unqualified",candidate_package:null,source:null},assistant_context:{current_step_id:"intro",enabled:false},journey:{journey_id:null,order_id:null,handoff_id:null},saved_at:Date.now()});
let state=load(),statusMessage="",saving=false;hydrateExamples();applyReviewPreset();render();
function clone(v){return JSON.parse(JSON.stringify(v))}function load(){try{const v=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");if(v&&v.flow_version==="q1_v2"&&v.schema_version===2&&STEPS.includes(v.current_step))return Object.assign(fresh(),v)}catch(e){}return fresh()}function save(){state.saved_at=Date.now();localStorage.setItem(DRAFT_KEY,JSON.stringify(state))}
function cleanId(v){return typeof v==="string"&&/^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$/.test(v)?v:null}function cleanViewed(v){if(!Array.isArray(v))return[];return[...new Set(v.map(x=>typeof x==="string"?cleanId(x):cleanId(x&&x.id)).filter(Boolean))].slice(0,24)}
function hydrateExamples(){if(Object.keys(state.examples_context||{}).length)return;let selected=null,viewed=[];for(const key of ["siteformo_source_example_payload","siteformo_example_tracking"]){try{const data=JSON.parse(localStorage.getItem(key)||"null");if(!data)continue;selected=selected||cleanId(data.selected_example_id||data.example_id);viewed.push(...cleanViewed(data.viewed_examples||data.viewed_example_ids))}catch(e){}}if(selected&&!viewed.includes(selected))viewed.push(selected);state.examples_context={};if(selected)state.examples_context.selected_example_id=selected;if(viewed.length)state.examples_context.viewed_examples=[...new Set(viewed)].slice(0,24);save()}
function applyReviewPreset(){if(!REVIEW_MODE)return;const p=new URLSearchParams(location.search);if(p.get("example")==="1"&&!state.examples_context.selected_example_id)state.examples_context={selected_example_id:"example-owner-review",viewed_examples:["example-owner-review"]};const screen=p.get("screen");if(!screen)return;state.project_class_intent="business_site";state.preferred_contact={channel:"email",value:"owner@example.test",normalized_value:"owner@example.test",purpose:"operational_communication",display_on_generated_website:false};state.existing_website={has_existing_website:screen!=="q3-no",url:["q3-yes","complete"].includes(screen)?"https://example.test":null,analysis:null};state.journey={journey_id:"journey-review",order_id:"order-review",handoff_id:null};const canonical=screen==="q3-no"||screen==="q3-yes"?"q3":screen;if(STEPS.includes(canonical))state.current_step=canonical;save()}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function progress(){const n={q1:1,q2:2,q3:3}[state.current_step];return n?`<div class="sfq-progress" aria-label="Question ${n} of 3"><span>Question ${n} of 3</span><span class="sfq-progress-track" aria-hidden="true"><span class="sfq-progress-bar" style="width:${n/3*100}%"></span></span></div>`:""}function choice(v,l,s){return`<button type="button" class="sfq-option" role="radio" aria-checked="${s===v}" data-value="${esc(v)}">${esc(l)}</button>`}function actions(back=true,label="Continue"){return`<div class="sfq-actions">${back?'<button type="button" class="sfq-button sfq-secondary" data-back>Back</button>':""}<button type="button" class="sfq-button sfq-primary" data-continue>${label}</button></div>`}function frame(c){root.innerHTML=`<main class="sfq-shell" data-q1-step="${state.current_step}">${progress()}<section class="sfq-panel" aria-labelledby="sfq-heading"><p class="sfq-context">Project setup</p>${c}<div class="sfq-error" role="alert" aria-live="assertive"></div><div class="sfq-status" role="status" aria-live="polite">${esc(statusMessage)}</div></section></main>`;wire()}
function render(){statusMessage="";if(state.current_step==="intro")frame(`${state.examples_context.selected_example_id?'<p class="sfq-example">Example selected</p>':""}<h1 id="sfq-heading">Let’s start with a few details</h1><p class="sfq-lead">Three quick questions to help us understand your project.</p>${actions(false)}`);if(state.current_step==="q1")frame(`<h1 id="sfq-heading">What kind of website are you looking for?</h1><p class="sfq-lead">Choose the option that feels closest to what you need.</p><div class="sfq-options" role="radiogroup" aria-labelledby="sfq-heading" data-group="intent">${Object.entries(INTENTS).map(([v,l])=>choice(v,l,state.project_class_intent)).join("")}</div>${actions(false)}`);if(state.current_step==="q2"){const c=state.preferred_contact.channel,field=c?`<div class="sfq-field"><label for="sfq-contact-value">${c==="email"?"Email address":c==="whatsapp"?"International WhatsApp number":"Telegram username"}</label><input id="sfq-contact-value" class="sfq-input" ${c==="email"?'type="email" autocomplete="email"':c==="whatsapp"?'type="tel" autocomplete="tel" inputmode="tel"':'type="text" autocomplete="off"'} value="${esc(state.preferred_contact.value)}" aria-describedby="sfq-contact-hint"><span class="sfq-hint" id="sfq-contact-hint">Used only for communication with SiteFormo. It will not appear on your website.</span></div>`:"";frame(`<h1 id="sfq-heading">How should SiteFormo contact you?</h1><p class="sfq-lead">Choose one written contact method.</p><div class="sfq-options" role="radiogroup" aria-labelledby="sfq-heading" data-group="contact">${Object.entries(CHANNELS).map(([v,l])=>choice(v,l,c)).join("")}</div>${field}${actions()}`)}if(state.current_step==="q3"){const a=state.existing_website.has_existing_website===true?"yes":state.existing_website.has_existing_website===false?"no":null;frame(`<h1 id="sfq-heading">Do you already have a website?</h1><div class="sfq-options" role="radiogroup" aria-labelledby="sfq-heading" data-group="website">${choice("yes","Yes",a)}${choice("no","No",a)}</div><div class="sfq-field" ${a==="yes"?"":"hidden"}><label for="sfq-website-url">Website URL</label><input id="sfq-website-url" class="sfq-input" type="url" inputmode="url" autocomplete="url" placeholder="https://example.com" value="${esc(state.existing_website.url||"")}"></div>${actions()}`)}if(state.current_step==="complete")frame(`<h1 id="sfq-heading">Great, we have the basics</h1><p class="sfq-lead">Next, tell us a little more about your business and what the website needs to do.</p><dl class="sfq-summary"><div><dt>Website</dt><dd>${esc(INTENTS[state.project_class_intent])}</dd></div><div><dt>Contact</dt><dd>${esc(CHANNELS[state.preferred_contact.channel])}</dd></div><div><dt>Existing website</dt><dd>${state.existing_website.has_existing_website?esc(state.existing_website.url):"No"}</dd></div></dl>${actions(true,"Continue")}`)}
function wire(){root.querySelector("[data-back]")?.addEventListener("click",back);root.querySelector("[data-continue]")?.addEventListener("click",advance);root.querySelectorAll("[data-group=intent] .sfq-option").forEach(b=>b.onclick=()=>{state.project_class_intent=b.dataset.value;save();render()});root.querySelectorAll("[data-group=contact] .sfq-option").forEach(b=>b.onclick=()=>{if(state.preferred_contact.channel!==b.dataset.value){state.preferred_contact.channel=b.dataset.value;state.preferred_contact.value="";state.preferred_contact.normalized_value=""}save();render()});root.querySelectorAll("[data-group=website] .sfq-option").forEach(b=>b.onclick=()=>{const yes=b.dataset.value==="yes";state.existing_website.has_existing_website=yes;if(!yes){state.existing_website.url=null;state.existing_website.analysis=null}save();render()});root.querySelector("#sfq-contact-value")?.addEventListener("input",e=>{state.preferred_contact.value=e.target.value;save()});root.querySelector("#sfq-website-url")?.addEventListener("input",e=>{state.existing_website.url=e.target.value;save()})}
function error(m,s){const box=root.querySelector(".sfq-error");box.textContent=m;const t=s&&root.querySelector(s);if(t){t.setAttribute("aria-invalid","true");t.focus()}}function normalizeContact(){let v=state.preferred_contact.value.trim();if(state.preferred_contact.channel==="telegram")v=v.startsWith("@")?v:`@${v}`;if(state.preferred_contact.channel==="whatsapp"){v=v.replace(/[\s().-]/g,"");if(v.startsWith("00"))v=`+${v.slice(2)}`}state.preferred_contact.normalized_value=v;return v}
function validContact(){const c=state.preferred_contact.channel,v=normalizeContact();if(!c)return error("Choose how SiteFormo should contact you."),false;if(!v)return error("Enter your contact detail.","#sfq-contact-value"),false;if(c==="email"&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))return error("Enter a valid email address.","#sfq-contact-value"),false;if(c==="whatsapp"&&!/^\+[1-9]\d{7,14}$/.test(v))return error("Use an international number, for example +353 85 123 4567.","#sfq-contact-value"),false;if(c==="telegram"&&!/^@[A-Za-z0-9_]{5,32}$/.test(v))return error("Enter a valid Telegram username, for example @username.","#sfq-contact-value"),false;return true}function normalizeUrl(){let v=(state.existing_website.url||"").trim();if(!v)return null;if(!/^https?:\/\//i.test(v))v=`https://${v}`;try{const u=new URL(v);if(!/^https?:$/.test(u.protocol)||!u.hostname.includes("."))return null;u.hash="";return u.toString()}catch(e){return null}}
function validate(){if(state.current_step==="q1"&&!INTENTS[state.project_class_intent])return error("Choose the closest website type."),false;if(state.current_step==="q2")return validContact();if(state.current_step==="q3"){if(typeof state.existing_website.has_existing_website!=="boolean")return error("Choose Yes or No."),false;if(state.existing_website.has_existing_website){const u=normalizeUrl();if(!u)return error("Enter a valid website URL.","#sfq-website-url"),false;state.existing_website.url=u}else state.existing_website.url=null}return true}function back(){const p={q2:"q1",q3:"q2",complete:"q3"}[state.current_step];if(p){state.current_step=p;state.assistant_context.current_step_id=p;save();render()}}
async function advance(){if(!validate())return;if(state.current_step==="intro"){try{await ensureProject()}catch(e){return error("We couldn’t start your project. Please try again.")}}if(state.current_step==="complete")return submit();const n={intro:"q1",q1:"q2",q2:"q3",q3:"complete"}[state.current_step];state.current_step=n;state.assistant_context.current_step_id=n;save();render()}
async function request(path,options={}){const credential=localStorage.getItem(VISITOR_KEY)||"";options.headers=Object.assign({},options.headers,credential?{"X-SiteFormo-Visitor":credential}:{});const response=await fetch(API_BASE+path,options);if(!response.ok)throw Error("Request failed");return response.json()}async function ensureProject(){if(state.journey.order_id)return;if(REVIEW_MODE){state.journey={journey_id:"journey-review",order_id:"order-review",handoff_id:null};save();return}const session=await request("/api/journey/session",{method:"POST"});if(session.credential)localStorage.setItem(VISITOR_KEY,session.credential);state.journey.journey_id=session.journey_id;const q=new URLSearchParams(location.search),project=await request("/api/orders/q1/project",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({order_id:cleanId(q.get("order_id")),handoff_id:cleanId(q.get("handoff_id"))})});state.journey.order_id=project.order_id;state.journey.handoff_id=project.handoff_id||null;save()}
function payload(){return{flow_version:"q1_v2",schema_version:2,project_class_intent:state.project_class_intent,preferred_contact:{channel:state.preferred_contact.channel,value:state.preferred_contact.value.trim(),normalized_value:state.preferred_contact.normalized_value,purpose:"operational_communication",display_on_generated_website:false},existing_website:{has_existing_website:state.existing_website.has_existing_website,url:state.existing_website.has_existing_website?state.existing_website.url:null,analysis:null},examples_context:clone(state.examples_context),package_browsing_context:state.package_browsing_context,package_qualification:{status:"unqualified",candidate_package:null,source:null},assistant_context:{current_step_id:"q1_complete",enabled:false}}}function redirectUrl(){return`${Q2_URL}?${new URLSearchParams({order_id:state.journey.order_id,project_class_intent:state.project_class_intent,entry:"q1_v2"})}`}
async function submit(){if(saving)return;saving=true;try{await ensureProject();if(REVIEW_MODE){statusMessage="Saved in local review mode. No production request was sent.";saving=false;const m=statusMessage;render();root.querySelector(".sfq-status").textContent=m;return}await request(`/api/orders/${encodeURIComponent(state.journey.order_id)}/q1`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload())});location.assign(redirectUrl())}catch(e){saving=false;error("We couldn’t save your answers. Nothing was submitted; please try again.")}}
window.__SITEFORMO_Q1_TEST__={getState:()=>clone(state),getPayload:payload,getRedirect:redirectUrl,setStep:s=>{if(STEPS.includes(s)){state.current_step=s;save();render()}},reset:()=>{localStorage.removeItem(DRAFT_KEY);state=fresh();hydrateExamples();render()}};
})();
</script>
