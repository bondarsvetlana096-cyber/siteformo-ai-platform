<!-- SiteFormo Q1 V2 local candidate. WordPress production is not modified. -->
<div id="sf-q1-root"></div>
<style>
  #sf-q1-root,#sf-q1-root *{box-sizing:border-box}#sf-q1-root{--bg:#080d1c;--card:#11182c;--ink:#fff;--muted:#bcc6dd;--accent:#765cff;min-height:100svh;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif;padding:24px 16px;overflow-x:clip}.sfq-shell{width:min(720px,100%);margin:auto}.sfq-progress{font-size:14px;color:var(--muted);margin-bottom:12px}.sfq-card{background:var(--card);border:1px solid #ffffff29;border-radius:24px;padding:clamp(22px,5vw,42px);box-shadow:0 18px 55px #0006}.sfq-card h1{font-size:clamp(30px,7vw,48px);line-height:1.08;margin:0 0 16px}.sfq-card p{color:var(--muted);line-height:1.6}.sfq-options{display:grid;gap:12px;margin:24px 0}.sfq-option,.sfq-primary,.sfq-secondary,.sfq-link{font:inherit}.sfq-option{min-height:58px;width:100%;border:2px solid #ffffff2b;border-radius:16px;background:#18223d;color:#fff;text-align:left;padding:15px 16px;cursor:pointer}.sfq-option[aria-pressed=true]{border-color:#21d4a3;background:#241d55}.sfq-option:focus-visible,.sfq-primary:focus-visible,.sfq-secondary:focus-visible,.sfq-link:focus-visible,.sfq-input:focus-visible,.sf-launcher:focus-visible{outline:3px solid #ffd166;outline-offset:3px}.sfq-field{margin:20px 0}.sfq-field label{display:block;font-weight:800;margin-bottom:8px}.sfq-input{width:100%;min-height:54px;border:2px solid #ffffff2b;border-radius:14px;padding:14px;font:inherit}.sfq-actions{display:flex;gap:12px;align-items:center;margin-top:26px}.sfq-primary,.sfq-secondary{min-height:54px;border:0;border-radius:16px;padding:14px 20px;font-weight:900;cursor:pointer}.sfq-primary{background:linear-gradient(135deg,var(--accent),#397cff);color:#fff;flex:1}.sfq-secondary{background:#ffffff18;color:#fff}.sfq-link{border:0;background:transparent;color:#cfc7ff;text-decoration:underline;padding:10px;cursor:pointer}.sfq-error{color:#ffb4b4;font-weight:700;min-height:24px}.sfq-review{font-size:14px;color:var(--muted);line-height:1.7}.sf-launcher{position:fixed;right:18px;bottom:max(18px,env(safe-area-inset-bottom));z-index:100;width:54px;height:54px;border:0;border-radius:50%;background:#765cff;color:white;font-weight:950;box-shadow:0 10px 35px #0008;cursor:pointer}.sf-support{position:fixed;right:18px;bottom:82px;z-index:99;width:min(330px,calc(100vw - 32px));background:#11182c;border:1px solid #ffffff2b;border-radius:18px;padding:18px;box-shadow:0 18px 55px #0009}.sf-support[hidden],.sfq-field[hidden]{display:none}.sf-support h2{font-size:18px;margin:0 0 8px}.sf-support p{margin:0;color:var(--muted)}@media(max-width:520px){#sf-q1-root{padding:16px 12px 92px}.sfq-card{border-radius:20px;padding:22px 18px}.sfq-actions{align-items:stretch;flex-direction:column-reverse}.sfq-primary,.sfq-secondary{width:100%}.sf-launcher{right:14px}}
</style>
<script>
(function(){
  "use strict";
  const root=document.getElementById("sf-q1-root"); if(!root)return;
  const API_BASE=window.SITEFORMO_API_BASE||"https://siteformo-ai-platform-production.up.railway.app";
  const Q2_URL="/extended-questionnaire/",DRAFT_KEY="siteformo_q1_v2_draft",VISITOR_KEY="siteformo_journey_credential_v1",TTL=14*24*60*60*1000;
  const steps=["q1_intro","q1_project_type","q1_contact","q1_existing_website","q1_complete"];
  const defaults={flow_version:"q1_v2",schema_version:2,current_step:"q1_intro",project_class_intent:null,preferred_contact:{channel:null,value:"",normalized_value:"",purpose:"operational_communication",display_on_generated_website:false},existing_website:{has_existing_website:null,url:null,analysis:null},journey:{journey_id:null,order_id:null,handoff_id:null},examples_context:{},package_browsing_context:null,package_qualification:{status:"unqualified",candidate_package:null,source:null},assistant_context:{current_step_id:"q1_intro",enabled:false,panel_open:false,draft:""},saved_at:Date.now()};
  const state=load(); let history=[]; let saving=false;
  function load(){try{const x=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");if(x&&x.schema_version===2&&Date.now()-x.saved_at<TTL)return Object.assign(structuredClone(defaults),x)}catch(e){}return structuredClone(defaults)}
  function persist(){state.saved_at=Date.now();localStorage.setItem(DRAFT_KEY,JSON.stringify(state))}
  function setStep(step,push=true){if(push&&state.current_step!==step)history.push(state.current_step);state.current_step=step;state.assistant_context.current_step_id=step;state.assistant_context.enabled=false;persist();render();}
  function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
  function progress(){const map={q1_project_type:1,q1_contact:2,q1_existing_website:3};return map[state.current_step]?`Question ${map[state.current_step]} of 3`:""}
  function option(value,label,selected){return `<button type="button" class="sfq-option" data-value="${esc(value)}" aria-pressed="${selected===value}">${esc(label)}</button>`}
  function frame(body){root.innerHTML=`<main class="sfq-shell" data-q1-step="${state.current_step}"><div class="sfq-progress" aria-live="polite">${progress()}</div><section class="sfq-card">${body}<div class="sfq-error" role="alert"></div></section></main><button class="sf-launcher" type="button" aria-label="Open SiteFormo support" aria-expanded="${state.assistant_context.panel_open}">SF</button><aside class="sf-support" ${state.assistant_context.panel_open?"":"hidden"}><h2>SiteFormo support</h2><p>Support will be available here. Your questionnaire progress is safe when this panel closes.</p></aside>`;wireCommon()}
  function render(){
    if(state.current_step==="q1_intro")frame(`<h1>Starting is simple</h1><p>There is no lengthy brief and no need for calls or meetings. Communication and support are handled in writing, and you do not need to have all your final content ready yet.</p><div class="sfq-actions"><button class="sfq-primary" data-next="q1_project_type">Start</button></div>`);
    if(state.current_step==="q1_project_type")frame(`<h1>What kind of website are you looking for?</h1><div class="sfq-options" data-choice="project">${option("one_page","Simple one-page website",state.project_class_intent)}${option("business_site","Business website",state.project_class_intent)}${option("ecommerce_catalog","Online store / catalogue",state.project_class_intent)}${option("online_service_platform","Online service / platform",state.project_class_intent)}${option("unsure","Not sure yet",state.project_class_intent)}</div>${actions("q1_contact")}`);
    if(state.current_step==="q1_contact"){const c=state.preferred_contact.channel;const labels={whatsapp:"Phone / WhatsApp number",telegram:"Telegram username",email:"Email address"};frame(`<h1>How should SiteFormo contact you?</h1><p>This is only for written communication with SiteFormo.</p>${c?`<p><strong>${esc(c[0].toUpperCase()+c.slice(1))}</strong> <button class="sfq-link" data-change-contact>Change contact method</button></p><div class="sfq-field"><label for="sf-contact">${labels[c]}</label><input id="sf-contact" class="sfq-input" autocomplete="${c==='email'?'email':c==='whatsapp'?'tel':'off'}" inputmode="${c==='email'?'email':c==='whatsapp'?'tel':'text'}" value="${esc(state.preferred_contact.value)}"></div>`:`<div class="sfq-options" data-choice="contact">${option("whatsapp","WhatsApp",c)}${option("telegram","Telegram",c)}${option("email","Email",c)}</div>`}${actions("q1_existing_website")}`)}
    if(state.current_step==="q1_existing_website"){const yes=state.existing_website.has_existing_website;frame(`<h1>Do you already have a website?</h1><div class="sfq-options" data-choice="website">${option("yes","Yes",yes===true?"yes":"")}${option("no","No",yes===false?"no":"")}</div><div class="sfq-field" ${yes===true?"":"hidden"}><label for="sf-website">Website URL</label><input id="sf-website" class="sfq-input" type="url" inputmode="url" autocomplete="url" placeholder="https://example.com" value="${esc(state.existing_website.url||'')}"></div>${actions("q1_complete")}`)}
    if(state.current_step==="q1_complete")frame(`<h1>Good start.</h1><p>Next, SiteFormo will ask a few simple questions about your business and what your website needs to do.</p><p>You do not need to plan the pages or write website content. SiteFormo will work that out from your answers.</p><div class="sfq-review">${esc(reviewText())}</div><div class="sfq-actions"><button class="sfq-secondary" data-back>Review answers</button><button class="sfq-primary" data-submit>Continue to detailed questionnaire</button></div>`);
  }
  function actions(next){return `<div class="sfq-actions"><button class="sfq-secondary" data-back>Back</button><button class="sfq-primary" data-next="${next}">Continue</button></div>`}
  function wireCommon(){root.querySelector(".sf-launcher").onclick=()=>{state.assistant_context.panel_open=!state.assistant_context.panel_open;persist();render()};root.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{const fallback=steps[Math.max(0,steps.indexOf(state.current_step)-1)];setStep(history.pop()||fallback,false)});root.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>advance(b.dataset.next));root.querySelector("[data-submit]")?.addEventListener("click",submit);root.querySelector("[data-change-contact]")?.addEventListener("click",()=>{state.preferred_contact.channel=null;state.preferred_contact.value="";state.preferred_contact.normalized_value="";persist();render()});root.querySelectorAll("[data-choice=project] .sfq-option").forEach(b=>b.onclick=()=>{state.project_class_intent=b.dataset.value;persist();render()});root.querySelectorAll("[data-choice=contact] .sfq-option").forEach(b=>b.onclick=()=>{state.preferred_contact.channel=b.dataset.value;persist();render()});root.querySelectorAll("[data-choice=website] .sfq-option").forEach(b=>b.onclick=()=>{const yes=b.dataset.value==="yes";state.existing_website.has_existing_website=yes;if(!yes){state.existing_website.url=null;state.existing_website.analysis=null;state.package_qualification={status:"unqualified",candidate_package:null,source:null}}persist();render()});root.querySelector("#sf-contact")?.addEventListener("input",e=>{state.preferred_contact.value=e.target.value;persist()});root.querySelector("#sf-website")?.addEventListener("input",e=>{state.existing_website.url=e.target.value;persist()})}
  function error(msg){root.querySelector(".sfq-error").textContent=msg||""}
  function normalizeContact(){let v=state.preferred_contact.value.trim();if(state.preferred_contact.channel==="telegram")v=v.replace(/^@?/,"@");if(state.preferred_contact.channel==="whatsapp")v=v.replace(/[^+\d]/g,"");state.preferred_contact.normalized_value=v;return v}
  async function advance(next){error("");if(state.current_step==="q1_intro"){try{await journey()}catch(e){return error("We could not start your project yet. Please try again.")}}if(state.current_step==="q1_project_type"&&!state.project_class_intent)return error("Choose the closest option.");if(state.current_step==="q1_contact"){const v=normalizeContact();if(!state.preferred_contact.channel||!v)return error("Choose a contact method and enter its value.");if(state.preferred_contact.channel==="email"&&!/^\S+@\S+\.\S+$/.test(v))return error("Enter a valid email address.")}if(state.current_step==="q1_existing_website"){if(state.existing_website.has_existing_website===null)return error("Choose Yes or No.");if(state.existing_website.has_existing_website){let u=(state.existing_website.url||"").trim();try{if(!/^https?:\/\//i.test(u))u="https://"+u;new URL(u);state.existing_website.url=u}catch(e){return error("Enter a valid website URL.")}analyzeWebsite(u)}}setStep(next)}
  async function analyzeWebsite(url){try{const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);const r=await fetch(API_BASE+"/api/analyze-website",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url}),signal:c.signal});clearTimeout(t);if(!r.ok)throw Error("analysis failed");const data=await r.json();state.existing_website.analysis={source:"existing_website",status:"unconfirmed",data};const candidate=data.recommended_package||data.package_candidate||null;state.package_qualification=candidate?{status:"candidate_unconfirmed",candidate_package:candidate,source:"existing_website_analysis"}:{status:"unqualified",candidate_package:null,source:null};persist()}catch(e){state.existing_website.analysis=null;state.package_qualification={status:"unqualified",candidate_package:null,source:null};persist()}}
  function reviewText(){const labels={one_page:"Simple one-page website",business_site:"Business website",ecommerce_catalog:"Online store / catalogue",online_service_platform:"Online service / platform",unsure:"Not sure yet"};return `${labels[state.project_class_intent]} / ${state.preferred_contact.channel} / ${state.existing_website.has_existing_website?state.existing_website.url:"No existing website"}`}
  async function journey(){let credential=localStorage.getItem(VISITOR_KEY)||"";let r=await fetch(API_BASE+"/api/journey/session",{method:"POST",headers:credential?{"X-SiteFormo-Visitor":credential}:{}});if(!r.ok)throw Error("Journey unavailable");let data=await r.json();if(data.credential){credential=data.credential;localStorage.setItem(VISITOR_KEY,credential)}state.journey.journey_id=data.journey_id;const query=new URL(location.href).searchParams;const requested=state.journey.order_id||query.get("order_id");r=await fetch(API_BASE+"/api/orders/q1/project",{method:"POST",headers:{"Content-Type":"application/json","X-SiteFormo-Visitor":credential},body:JSON.stringify({order_id:requested||null,handoff_id:query.get("handoff_id")})});if(!r.ok)throw Error("Project unavailable");data=await r.json();state.journey.order_id=data.order_id;persist();return credential}
  function q2Compatibility(){const map={one_page:"landing",business_site:"business",ecommerce_catalog:"store",online_service_platform:"platform",unsure:"not_sure"};const c=state.preferred_contact;localStorage.setItem("siteformo_order_id",state.journey.order_id);localStorage.setItem("siteformo_first_questionnaire",JSON.stringify(state));localStorage.setItem("siteformo_project_type",map[state.project_class_intent]);localStorage.setItem("siteformo_contact_channel",c.channel);localStorage.setItem("siteformo_contact_value",c.normalized_value);localStorage.setItem("siteformo_current_website_url",state.existing_website.url||"")}
  async function submit(){if(saving)return;saving=true;error("");try{const credential=await journey();const payload={flow_version:state.flow_version,schema_version:state.schema_version,project_class_intent:state.project_class_intent,preferred_contact:state.preferred_contact,existing_website:state.existing_website,examples_context:state.examples_context,package_browsing_context:state.package_browsing_context,package_qualification:state.package_qualification,assistant_context:{current_step_id:"q1_complete",enabled:false}};const r=await fetch(`${API_BASE}/api/orders/${encodeURIComponent(state.journey.order_id)}/q1`,{method:"PATCH",headers:{"Content-Type":"application/json","X-SiteFormo-Visitor":credential},body:JSON.stringify(payload)});if(!r.ok)throw Error("Could not save questionnaire");q2Compatibility();location.assign(`${Q2_URL}?order_id=${encodeURIComponent(state.journey.order_id)}&project_class_intent=${encodeURIComponent(state.project_class_intent)}&entry=q1_v2`)}catch(e){error("We could not save your answers yet. Please try again.");saving=false}}
  let scrollTick=false;addEventListener("scroll",()=>{if(scrollTick||!state.assistant_context.panel_open)return;scrollTick=true;requestAnimationFrame(()=>{state.assistant_context.panel_open=false;persist();render();scrollTick=false})},{passive:true});
  render();
})();
</script>
